    <script>
      // Compatibility shim for environments where window.fetch is getter-only on prototype
      try {
        if (typeof window !== 'undefined') {
          const originalFetch = window.fetch ? window.fetch.bind(window) : undefined;
          let currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get() {
              return currentFetch || (originalFetch ? originalFetch : undefined);
            },
            set(newFetch) {
              currentFetch = typeof newFetch === 'function' ? newFetch.bind(window) : newFetch;
            },
            configurable: true,
            enumerable: true,
          });
        }
      } catch (e) {
        // Silently ignore if already configurable
      }
    </script>
